<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<rect width="760" height="400" fill="#fff"/>
<rect x="1" y="1" width="758" height="398" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">预处理必须跟模型一起保存</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">只保存分类器是最常见的上线事故来源</text>
<rect x="28" y="92" width="336" height="230" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="1.3"/>
<text x="48" y="118" font-family="Inter,PingFang SC,sans-serif" font-size="13" font-weight="700" fill="#059669">训练时（正确）</text>
<text x="48" y="138" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">Pipeline 把两步绑成一个整体</text>
<rect x="48" y="156" width="180" height="38" rx="7" fill="#fff" stroke="#6b7280" stroke-width="1.2"/>
<text x="138" y="173" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#1f2937">原始特征</text>
<text x="138" y="187" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="9.5" fill="#6b7280">半径 6~28</text>
<line x1="138" y1="195" x2="138" y2="204" stroke="#c7cbd6" stroke-width="1.6" stroke-linecap="round"/><polygon points="138,204 134.5,196.8 141.5,196.8" fill="#c7cbd6"/>
<rect x="48" y="206" width="180" height="38" rx="7" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
<text x="138" y="223" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#1f2937">StandardScaler</text>
<text x="138" y="237" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="9.5" fill="#6b7280">记住均值/方差</text>
<line x1="138" y1="245" x2="138" y2="254" stroke="#c7cbd6" stroke-width="1.6" stroke-linecap="round"/><polygon points="138,254 134.5,246.8 141.5,246.8" fill="#c7cbd6"/>
<rect x="48" y="256" width="180" height="38" rx="7" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="138" y="273" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#1f2937">LogisticRegression</text>
<text x="138" y="287" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="9.5" fill="#6b7280">训练好的权重</text>
<text x="248" y="230" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#059669">→ joblib.dump(整体)</text>
<text x="248" y="250" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#059669">推理时无需手动变换</text>
<rect x="396" y="92" width="336" height="230" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="416" y="118" font-family="Inter,PingFang SC,sans-serif" font-size="13" font-weight="700" fill="#dc2626">推理时（只存了模型）</text>
<text x="416" y="138" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">少了标准化这一步，量纲差 100 倍</text>
<rect x="416" y="156" width="200" height="38" rx="7" fill="#fff" stroke="#6b7280" stroke-width="1.2"/>
<text x="516" y="173" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#1f2937">原始特征</text>
<text x="516" y="187" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="9.5" fill="#6b7280">半径 6~28</text>
<line x1="516" y1="195" x2="516" y2="204" stroke="#c7cbd6" stroke-width="1.6" stroke-linecap="round"/><polygon points="516,204 512.5,196.8 519.5,196.8" fill="#c7cbd6"/>
<rect x="416" y="206" width="200" height="38" rx="7" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
<text x="516" y="223" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#1f2937">（缺失）</text>
<text x="516" y="237" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="9.5" fill="#6b7280">没有标准化</text>
<line x1="516" y1="245" x2="516" y2="254" stroke="#c7cbd6" stroke-width="1.6" stroke-linecap="round"/><polygon points="516,254 512.5,246.8 519.5,246.8" fill="#c7cbd6"/>
<rect x="416" y="256" width="200" height="38" rx="7" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="516" y="273" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11" font-weight="600" fill="#1f2937">LogisticRegression</text>
<text x="516" y="287" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="9.5" fill="#6b7280">权重按标准化后训练</text>
<text x="624" y="230" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#dc2626">✕ 不报错</text>
<text x="624" y="248" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#dc2626">只是结果错</text>
<text x="28" y="352" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#1f2937">把 scaler 一起保存 → 推理时传原始特征即可，不会漏步骤</text>
<text x="28" y="376" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">判断标准：只要脚本里出现 .fit()，它就应该在 Pipeline 里</text>
</svg>
