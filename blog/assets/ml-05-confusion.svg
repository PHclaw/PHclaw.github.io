<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420">
<rect width="760" height="420" fill="#fff"/>
<rect x="1" y="1" width="758" height="418" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">混淆矩阵：把「对错」拆成四种</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">准确率只看对角线，掩盖了两个错误格子的差异</text>
<text x="250" y="112" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#6b7280">实际为正</text>
<text x="450" y="112" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#6b7280">实际为负</text>
<text x="150" y="182" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#6b7280">预测为正</text>
<text x="150" y="282" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#6b7280">预测为负</text>
<rect x="190" y="126" width="180" height="86" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="1.6"/>
<text x="280" y="158" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="17" font-weight="700" fill="#059669">TP</text>
<text x="280" y="182" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#1f2937">真正例</text>
<text x="280" y="200" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">正确识别</text>
<rect x="390" y="126" width="180" height="86" rx="10" fill="#fed7aa" stroke="#c2410c" stroke-width="1.6"/>
<text x="480" y="158" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="17" font-weight="700" fill="#c2410c">FP</text>
<text x="480" y="182" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#1f2937">假正例 · 误报</text>
<text x="480" y="200" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">报了但错了</text>
<rect x="190" y="226" width="180" height="86" rx="10" fill="#fecaca" stroke="#dc2626" stroke-width="1.6"/>
<text x="280" y="258" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="17" font-weight="700" fill="#dc2626">FN</text>
<text x="280" y="282" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#1f2937">假负例 · 漏报</text>
<text x="280" y="300" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">该报没报</text>
<rect x="390" y="226" width="180" height="86" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/>
<text x="480" y="258" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="17" font-weight="700" fill="#0891b2">TN</text>
<text x="480" y="282" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#1f2937">真负例</text>
<text x="480" y="300" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">正确排除</text>
<text x="28" y="352" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#1f2937">准确率 = (TP + TN) / 总数 —— 把下面两格的代价当成一样重</text>
<text x="28" y="376" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#dc2626">但「误报」和「漏报」在业务上常常差几个数量级</text>
<text x="28" y="400" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">混淆矩阵的价值：逼你把这两种错误分开看</text>
</svg>
