<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500">
<rect width="760" height="500" fill="#fff"/>
<rect x="1" y="1" width="758" height="498" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">三种最常见的数据泄漏</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">泄漏不会让程序崩溃，只会让评估结果失去意义</text>
<rect x="28" y="92" width="704" height="106" rx="10" fill="#f5f7fa"/>
<text x="48" y="118" font-family="Inter,PingFang SC,sans-serif" font-size="13" font-weight="700" fill="#1f2937">① 用测试集反复调参</text>
<text x="48" y="138" font-family="Inter,PingFang SC,sans-serif" font-size="10.8" fill="#6b7280">调了 20 次超参，每次都看测试集指标</text>
<rect x="48" y="150" width="130" height="32" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
<text x="113.0" y="171" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#1f2937">train</text>
<rect x="190" y="150" width="130" height="32" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
<text x="255.0" y="171" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#1f2937">val</text>
<rect x="332" y="150" width="130" height="32" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
<text x="397.0" y="171" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#1f2937">test</text>
<text x="478" y="170" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#dc2626">✕ 测试集参与了决策 → 它不再中立</text>
<rect x="28" y="212" width="704" height="106" rx="10" fill="#f5f7fa"/>
<text x="48" y="238" font-family="Inter,PingFang SC,sans-serif" font-size="13" font-weight="700" fill="#1f2937">② 先预处理再划分</text>
<text x="48" y="258" font-family="Inter,PingFang SC,sans-serif" font-size="10.8" fill="#6b7280">用全量数据算均值方差，再切分</text>
<rect x="48" y="270" width="130" height="32" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
<text x="113.0" y="291" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#1f2937">全量 fit</text>
<rect x="190" y="270" width="130" height="32" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
<text x="255.0" y="291" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#1f2937">train</text>
<rect x="332" y="270" width="130" height="32" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
<text x="397.0" y="291" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#1f2937">test</text>
<text x="478" y="290" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#dc2626">✕ 测试集的分布泄漏进了训练</text>
<rect x="28" y="332" width="704" height="106" rx="10" fill="#f5f7fa"/>
<text x="48" y="358" font-family="Inter,PingFang SC,sans-serif" font-size="13" font-weight="700" fill="#1f2937">③ 时间序列随机切分</text>
<text x="48" y="378" font-family="Inter,PingFang SC,sans-serif" font-size="10.8" fill="#6b7280">用 2024 年的数据训练，去预测 2023 年</text>
<rect x="48" y="390" width="130" height="32" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
<text x="113.0" y="411" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#1f2937">2023</text>
<rect x="190" y="390" width="130" height="32" rx="6" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/>
<text x="255.0" y="411" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#1f2937">2024</text>
<rect x="332" y="390" width="130" height="32" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.2"/>
<text x="397.0" y="411" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#1f2937">随机打乱</text>
<text x="478" y="410" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#dc2626">✕ 未来信息泄漏到过去</text>
<text x="28" y="462" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#059669">共同点：离线指标会很好看，上线就掉 —— 而且不会报错</text>
<text x="28" y="484" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">排查方法：问自己「预测那一刻，这个信息真的拿得到吗」</text>
</svg>
