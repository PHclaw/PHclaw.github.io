<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380">
<rect width="760" height="380" fill="#fff"/>
<rect x="1" y="1" width="758" height="378" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">分数不是百分比，也没有统一尺度</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">两批数据用同一模型编码，分数区间差了一截 —— 阈值不能跨数据集套用</text>
<rect x="28" y="92" width="340" height="210" rx="10" fill="#f5f7fa"/><text x="48" y="118" font-family="Inter,PingFang SC,sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">数据集 A：短问答对</text><text x="48" y="136" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">分数整体偏高</text><line x1="52" y1="268" x2="332" y2="268" stroke="#e5e9f0"/><rect x="54" y="168" width="24" height="100" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/><rect x="82" y="173" width="24" height="95" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/><rect x="110" y="175" width="24" height="93" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/><rect x="138" y="178" width="24" height="90" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/><rect x="166" y="184" width="24" height="84" rx="3" fill="#d1fae5" stroke="#059669" stroke-width="1"/><rect x="194" y="191" width="24" height="77" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="222" y="199" width="24" height="69" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="250" y="209" width="24" height="59" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="278" y="218" width="24" height="50" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="306" y="233" width="24" height="35" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><line x1="52" y1="189" x2="332" y2="189" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="332" y="182" text-anchor="end" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">阈值 0.7</text><text x="48" y="290" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">0.7 能筛出 5 条</text>
<rect x="392" y="92" width="340" height="210" rx="10" fill="#f5f7fa"/><text x="412" y="118" font-family="Inter,PingFang SC,sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">数据集 B：长技术文档</text><text x="412" y="136" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">分数整体偏低</text><line x1="416" y1="268" x2="696" y2="268" stroke="#e5e9f0"/><rect x="418" y="209" width="24" height="59" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="446" y="215" width="24" height="53" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="474" y="219" width="24" height="49" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="502" y="223" width="24" height="45" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="530" y="226" width="24" height="42" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="558" y="230" width="24" height="38" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="586" y="234" width="24" height="34" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="614" y="239" width="24" height="29" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="642" y="245" width="24" height="23" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><rect x="670" y="251" width="24" height="17" rx="3" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/><line x1="416" y1="189" x2="696" y2="189" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4"/><text x="696" y="182" text-anchor="end" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" font-weight="600" fill="#dc2626">同一阈值 0.7</text><text x="412" y="290" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">0.7 一条都筛不出 → 误判为「坏了」</text>
<text x="28" y="336" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#1f2937">同一个模型、同一个阈值，换个数据集就从「刚好」变成「全空」</text>
<text x="28" y="356" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">所以阈值必须按实际分布定，不能照搬别人的 0.7 / 0.8</text>
</svg>
