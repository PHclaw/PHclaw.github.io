<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<rect width="760" height="400" fill="#fff"/>
<rect x="1" y="1" width="758" height="398" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">按顺序查，不要跳步</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">先怀疑配置，再怀疑数据，最后才怀疑算法</text>
<rect x="30" y="100" width="330" height="38" rx="7" fill="#fff" stroke="#4f46e5" stroke-width="1.3"/>
<text x="44" y="124" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#1f2937">① embedding 端点配了吗？</text>
<text x="380" y="124" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">没配 → 直接报错，别静默</text>
<line x1="195" y1="138" x2="195" y2="148" stroke="#c7cbd6" stroke-width="1.6"/>
<rect x="30" y="150" width="330" height="38" rx="7" fill="#fff" stroke="#0891b2" stroke-width="1.3"/>
<text x="44" y="174" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#1f2937">② 分块数 > 0 吗？</text>
<text x="380" y="174" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">为 0 → 检查文档是否含文字层</text>
<line x1="195" y1="188" x2="195" y2="198" stroke="#c7cbd6" stroke-width="1.6"/>
<rect x="30" y="200" width="330" height="38" rx="7" fill="#fff" stroke="#4f46e5" stroke-width="1.3"/>
<text x="44" y="224" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#1f2937">③ 向量维度匹配吗？</text>
<text x="380" y="224" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">不匹配 → 用新模型重新入库</text>
<line x1="195" y1="238" x2="195" y2="248" stroke="#c7cbd6" stroke-width="1.6"/>
<rect x="30" y="250" width="330" height="38" rx="7" fill="#fff" stroke="#0891b2" stroke-width="1.3"/>
<text x="44" y="274" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#1f2937">④ 原始相似度分数多少？</text>
<text x="380" y="274" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">都很低 → 调阈值或改分块</text>
<line x1="195" y1="288" x2="195" y2="298" stroke="#c7cbd6" stroke-width="1.6"/>
<rect x="30" y="300" width="330" height="38" rx="7" fill="#fff" stroke="#4f46e5" stroke-width="1.3"/>
<text x="44" y="324" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#1f2937">⑤ prompt 里有 context 吗？</text>
<text x="380" y="324" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">没有 → 修拼接逻辑</text>
</svg>
