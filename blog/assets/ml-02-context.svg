<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390">
<rect width="760" height="390" fill="#fff"/>
<rect x="1" y="1" width="758" height="388" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">分布式假设：看一个词和谁混在一起</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">能出现在相同上下文里的词，意思相近 —— 这是训练目标的全部依据</text>
<text x="40" y="126" font-family="Inter,PingFang SC,sans-serif" font-size="13" fill="#1f2937">我早上喜欢喝</text>
<rect x="130" y="107" width="50" height="28" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
<text x="140" y="127" font-family="Inter,PingFang SC,sans-serif" font-size="13" font-weight="700" fill="#059669">咖啡</text>
<text x="40" y="172" font-family="Inter,PingFang SC,sans-serif" font-size="13" fill="#1f2937">我下午也常喝</text>
<rect x="130" y="153" width="35" height="28" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
<text x="140" y="173" font-family="Inter,PingFang SC,sans-serif" font-size="13" font-weight="700" fill="#059669">茶</text>
<text x="40" y="218" font-family="Inter,PingFang SC,sans-serif" font-size="13" fill="#1f2937">加班时会点一杯</text>
<rect x="143" y="199" width="50" height="28" rx="6" fill="#d1fae5" stroke="#059669" stroke-width="1.3"/>
<text x="153" y="219" font-family="Inter,PingFang SC,sans-serif" font-size="13" font-weight="700" fill="#059669">牛奶</text>
<text x="430" y="120" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">↓ 能填进同一个空格</text>
<text x="430" y="142" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">　 向量就被拉近</text>
<circle cx="544" cy="228" r="9" fill="#059669"/>
<text x="544" y="212" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#059669">咖啡</text>
<circle cx="590" cy="210" r="9" fill="#059669"/>
<text x="590" y="194" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#059669">茶</text>
<circle cx="638" cy="236" r="9" fill="#059669"/>
<text x="638" y="220" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#059669">牛奶</text>
<ellipse cx="590" cy="226" rx="82" ry="58" fill="#059669" opacity="0.08"/>
<circle cx="710" cy="330" r="9" fill="#6b7280"/>
<text x="710" y="358" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">汽车</text>
<text x="710" y="376" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">填不进去</text>
</svg>
