<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470"><rect width="860" height="470" fill="#ffffff"/><rect x="1" y="1" width="858" height="468" rx="12" fill="none" stroke="#e5e7eb"/><text x="28" y="40" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#1f2937">三种交接协议：别把「请你接手」和「请你补上」混着用</text><text x="28" y="63" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#6b7280">同一套系统里，协作语义必须显式区分</text><rect x="28" y="86" width="804" height="54" rx="8" fill="#f8fafc" stroke="#e5e7eb"/>
<text x="46" y="108" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="600" fill="#1f2937">当前这个智能体接到任务后，先判断一件事：我自己能不能干完？</text>
<text x="46" y="128" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">能 → 直接给结果；不能 → 判断是「别人更合适」还是「这个方向根本没人」</text>
<rect x="30" y="166" width="252" height="150" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
<text x="48" y="194" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="13.5" font-weight="700" fill="#059669">能自己干完</text>
<rect x="48" y="208" width="150" height="26" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="72" y="226" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#059669">无需交接</text>
<text x="48" y="256" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">直接给结果</text>
<text x="48" y="278" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">不交接，其他人不参与</text>
<rect x="308" y="166" width="252" height="150" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="326" y="194" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="13.5" font-weight="700" fill="#d97706">别人更合适</text>
<rect x="326" y="208" width="150" height="26" rx="6" fill="#ffffff" stroke="#d97706" stroke-width="1.1"/>
<text x="338" y="226" font-family="Consolas,monospace" font-size="11.5" font-weight="600" fill="#d97706">[[HANDOFF]]</text>
<text x="326" y="256" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">我做不了，换你</text>
<text x="326" y="278" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">系统真的换人</text>
<rect x="586" y="166" width="252" height="150" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="604" y="194" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="13.5" font-weight="700" fill="#4f46e5">缺这个方向的人</text>
<rect x="604" y="208" width="150" height="26" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="1.1"/>
<text x="616" y="226" font-family="Consolas,monospace" font-size="11.5" font-weight="600" fill="#4f46e5">[[NEED_MEMBER]]</text>
<text x="604" y="256" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">没人能做，补一个</text>
<text x="604" y="278" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">系统真的换人</text>
<rect x="28" y="336" width="804" height="56" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="1.3"/>
<text x="46" y="358" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="700" fill="#4f46e5">第四种：NEXT —— 干完了，但还有别人的部分</text>
<text x="46" y="378" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">[[NEXT: 成员名 | 要他补什么]]   语义是「请你补上另一半」，不是「请你接手」——这个区别决定了用户看到的是协作还是甩锅</text>
<rect x="28" y="406" width="804" height="44" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="46" y="426" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="600" fill="#dc2626">踩过的坑：模型在正文里写「已转给 XX」</text>
<text x="248" y="426" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#dc2626">——模型说了不等于系统做了。没有协议标记，界面上的「转交」只是一句空话</text>
<text x="46" y="443" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">同理：路由宁可返回「无人能接」，也不要拿「软件方面的东西」这种模糊描述硬赌——硬答会给出编造的数字</text></svg>