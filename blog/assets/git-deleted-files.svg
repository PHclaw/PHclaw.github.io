<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
<rect width="760" height="300" fill="#fff"/>
<rect x="1" y="1" width="758" height="298" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">一条命令列出全部消失的文件</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">合并已提交后普通 diff 看不出问题，必须对比另一个父提交</text>
<rect x="28" y="112" width="20" height="20" rx="4" fill="#fecaca" stroke="#dc2626" stroke-width="1.3"/>
<text x="60" y="127" font-family="Inter,PingFang SC,sans-serif" font-size="12.5" fill="#1f2937">skills/（11 个技能）</text>
<text x="360" y="127" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#dc2626">11</text>
<text x="400" y="127" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">→ 技能广场返回空</text>
<rect x="28" y="164" width="20" height="20" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.3"/>
<text x="60" y="179" font-family="Inter,PingFang SC,sans-serif" font-size="12.5" fill="#1f2937">frontend/…/workflow/nodes/</text>
<text x="360" y="179" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#4f46e5">1</text>
<text x="400" y="179" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">→ TS2307 构建失败</text>
<rect x="28" y="216" width="20" height="20" rx="4" fill="#fed7aa" stroke="#c2410c" stroke-width="1.3"/>
<text x="60" y="231" font-family="Inter,PingFang SC,sans-serif" font-size="12.5" fill="#1f2937">scripts/（初始化脚本）</text>
<text x="360" y="231" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#c2410c">3</text>
<text x="400" y="231" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">→ 文档命令失效</text>
<text x="28" y="286" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">git diff --diff-filter=D --name-only &lt;另一父提交&gt; HEAD</text>
</svg>
