<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
<rect width="760" height="300" fill="#fff"/>
<rect x="1" y="1" width="758" height="298" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">RAG 的五个环节</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">看起来是一条直线，实际有五个各自可能出错的地方</text>
<rect x="30" y="130" width="120" height="52" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.4"/><text x="90.0" y="160.0" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="700" fill="#1f2937">上传文档</text>
<line x1="154" y1="156" x2="176" y2="156" stroke="#c7cbd6" stroke-width="2" stroke-linecap="round"/><polygon points="176,156 167.9,159.9 167.9,152.1" fill="#c7cbd6"/>
<rect x="180" y="130" width="120" height="52" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.4"/><text x="240.0" y="160.0" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="700" fill="#1f2937">分块</text>
<line x1="304" y1="156" x2="326" y2="156" stroke="#c7cbd6" stroke-width="2" stroke-linecap="round"/><polygon points="326,156 317.9,159.9 317.9,152.1" fill="#c7cbd6"/>
<rect x="330" y="130" width="120" height="52" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.4"/><text x="390.0" y="160.0" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="700" fill="#1f2937">embedding</text>
<line x1="454" y1="156" x2="476" y2="156" stroke="#c7cbd6" stroke-width="2" stroke-linecap="round"/><polygon points="476,156 467.9,159.9 467.9,152.1" fill="#c7cbd6"/>
<rect x="480" y="130" width="120" height="52" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.4"/><text x="540.0" y="160.0" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="700" fill="#1f2937">向量库</text>
<line x1="604" y1="156" x2="626" y2="156" stroke="#c7cbd6" stroke-width="2" stroke-linecap="round"/><polygon points="626,156 617.9,159.9 617.9,152.1" fill="#c7cbd6"/>
<rect x="630" y="130" width="120" height="52" rx="8" fill="#fff" stroke="#4f46e5" stroke-width="1.4"/><text x="690.0" y="160.0" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="700" fill="#1f2937">检索注入</text>
<text x="30" y="220" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#dc2626">↑ 任何一步静默失败，表现都是「检索不出内容」</text>
<text x="30" y="244" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#059669">↑ 所以每一步都要「响亮地失败」，而不是返回空列表</text>
</svg>
