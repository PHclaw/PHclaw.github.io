<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">同方向 = 同一种语义关系</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">两组对边平行且等长：这个平行四边形近似成立，向量加减才有意义</text>
<line x1="200" y1="350" x2="480" y2="350" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/><polygon points="480,350 470.9,354.1 470.9,345.9" fill="#059669"/>
<text x="340" y="378" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#059669">女人方向（性别 +1）</text>
<line x1="200" y1="170" x2="480" y2="170" stroke="#059669" stroke-width="2.6" stroke-linecap="round"/><polygon points="480,170 470.9,174.1 470.9,165.9" fill="#059669"/>
<text x="340" y="140" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#059669">同一个方向</text>
<line x1="172" y1="330" x2="172" y2="150" stroke="#0891b2" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="6 5"/><polygon points="172,150 176.1,159.1 167.9,159.1" fill="#0891b2"/>
<text x="150" y="245" text-anchor="end" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#0891b2">皇室</text>
<circle cx="200" cy="150" r="8" fill="#4f46e5"/><circle cx="200" cy="150" r="15" fill="#4f46e5" opacity="0.13"/><text x="200" y="134" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12.5" font-weight="600" fill="#4f46e5">king 国王</text>
<circle cx="480" cy="150" r="8" fill="#4f46e5"/><circle cx="480" cy="150" r="15" fill="#4f46e5" opacity="0.13"/><text x="480" y="134" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="12.5" font-weight="600" fill="#4f46e5">queen 女王</text>
<circle cx="200" cy="330" r="7" fill="#6b7280"/>
<circle cx="200" cy="330" r="14" fill="#6b7280" opacity="0.13"/>
