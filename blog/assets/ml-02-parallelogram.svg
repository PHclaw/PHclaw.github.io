<circle cx="480" cy="330" r="14" fill="#6b7280" opacity="0.13"/>
<text x="498" y="335" text-anchor="start" font-family="Inter,PingFang SC,sans-serif" font-size="12.5" font-weight="600" fill="#6b7280">woman 女人</text>
<rect x="536" y="230" width="196" height="96" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.2"/>
<text x="552" y="256" font-family="Inter,PingFang SC,sans-serif" font-size="12.5" fill="#1f2937">king - man + woman</text>
<text x="552" y="282" font-family="Inter,PingFang SC,sans-serif" font-size="12.5" fill="#1f2937">= 从 woman 出发</text>
