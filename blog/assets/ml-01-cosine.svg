<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<rect width="760" height="400" fill="#ffffff"/>
<rect x="1" y="1" width="758" height="398" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">余弦相似度：看方向，不看长度</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">"天气不错" 和 "今天天气真不错啊" 意思一样，只是后者更长 —— 方向比长度重要</text>
<line x1="170" y1="310" x2="700" y2="310" stroke="#e5e9f0"/>
<line x1="170" y1="310" x2="170" y2="90" stroke="#e5e9f0"/>
<line x1="170" y1="310" x2="560" y2="130" stroke="#4f46e5" stroke-width="3" stroke-linecap="round"/><polygon points="560,130 553.4450765666315,138.83362772493146 549.0251183330375,129.25705155214433" fill="#4f46e5"/>
<line x1="170" y1="310" x2="420" y2="190" stroke="#0891b2" stroke-width="3" stroke-linecap="round"/><polygon points="420,190 413.57931551848486,198.93167457920578 409.01514436523763,189.4229846766074" fill="#0891b2"/>
<text x="565" y="124" font-family="sans-serif" font-size="14" font-weight="600" fill="#4f46e5">向量 A（长）</text>
<text x="300" y="182" font-family="sans-serif" font-size="14" font-weight="600" fill="#0891b2">向量 B（短）</text>
<path d="M 300 310 A 130 130 0 0 0 292 252" fill="none" stroke="#6b7280" stroke-width="1.5"/>
<text x="312" y="278" font-family="sans-serif" font-size="12" fill="#6b7280">θ 很小</text>
<rect x="440" y="270" width="270" height="76" rx="9" fill="#f5f7fa"/>
<text x="458" y="296" font-family="sans-serif" font-size="13" fill="#1f2937">方向几乎一致 → cos(θ) ≈ 0.98</text>
<text x="458" y="320" font-family="sans-serif" font-size="12" fill="#6b7280">长度不同没关系，语义照样相近</text>
</svg>
