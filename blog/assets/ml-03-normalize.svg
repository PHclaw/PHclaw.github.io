<line x1="150" y1="300" x2="170" y2="120" stroke="#0891b2" stroke-width="2.4" stroke-linecap="round"/><polygon points="170,120 173.0,129.5 164.9,128.6" fill="#0891b2"/>
<line x1="150" y1="300" x2="110" y2="76" stroke="#c2410c" stroke-width="2.4" stroke-linecap="round"/><polygon points="110,76 115.6,84.3 107.6,85.7" fill="#c2410c"/>
<text x="150" y="328" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">归一化前</text>
<text x="150" y="346" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">长度各不相同</text>
<line x1="372" y1="210" x2="420" y2="210" stroke="#6b7280" stroke-width="2.4" stroke-linecap="round"/><polygon points="420,210 410.9,214.1 410.9,205.9" fill="#6b7280"/>
<text x="396" y="196" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" font-weight="600" fill="#6b7280">÷‖v‖</text>
<circle cx="570" cy="220" r="110" fill="#059669" opacity="0.07"/>
<circle cx="570" cy="220" r="110" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="434" y1="220" x2="706" y2="220" stroke="#e5e9f0"/>
<line x1="570" y1="84" x2="570" y2="356" stroke="#e5e9f0"/>
