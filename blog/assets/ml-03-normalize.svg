<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390">
<rect width="760" height="390" fill="#fff"/>
<rect x="1" y="1" width="758" height="388" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">归一化把长度抹掉</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">很多 embedding API 直接返回单位向量，所以点积检索和余弦检索等价</text>
<line x1="150" y1="300" x2="350" y2="300" stroke="#e5e9f0"/>
<line x1="150" y1="300" x2="150" y2="110" stroke="#e5e9f0"/>
