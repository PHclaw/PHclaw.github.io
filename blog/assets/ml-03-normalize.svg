<text x="570" y="376" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#059669">归一化后：都在单位圆上</text>
<text x="570" y="72" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="11" fill="#6b7280">长度信息被丢弃，只剩方向</text>
<text x="28" y="368" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#059669">此时 点积 = 余弦  —— 因为 1 × 1 × cos(θ) = cos(θ)</text>
</svg>
