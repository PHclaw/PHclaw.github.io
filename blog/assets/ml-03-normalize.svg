<line x1="570" y1="220" x2="582.1474678682331" y2="110.67278918590193" stroke="#0891b2" stroke-width="2.2" stroke-linecap="round"/><polygon points="582.1474678682331,110.67278918590193 585.2,120.2 577.1,119.3" fill="#0891b2"/>
