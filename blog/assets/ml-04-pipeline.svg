<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400">
<rect width="760" height="400" fill="#fff"/>
<rect x="1" y="1" width="758" height="398" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">同一条链路，数据在每步都变了形态</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">搞混「哪一环处理什么」是多数 RAG 问题的起点</text>
<rect x="30" y="112" width="122" height="70" rx="9" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.4"/>
<text x="91.0" y="140" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">文档</text>
<text x="91.0" y="162" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#6b7280">PDF/MD</text>
<line x1="156" y1="147" x2="170" y2="147" stroke="#c7cbd6" stroke-width="1.8" stroke-linecap="round"/><polygon points="170,147 162.8,150.5 162.8,143.5" fill="#c7cbd6"/>
<rect x="170" y="112" width="122" height="70" rx="9" fill="#fed7aa" stroke="#c2410c" stroke-width="1.4"/>
<text x="231.0" y="140" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">分块</text>
<text x="231.0" y="162" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#c2410c">N 块文本</text>
<line x1="296" y1="147" x2="310" y2="147" stroke="#c7cbd6" stroke-width="1.8" stroke-linecap="round"/><polygon points="310,147 302.8,150.5 302.8,143.5" fill="#c7cbd6"/>
<rect x="310" y="112" width="122" height="70" rx="9" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="371.0" y="140" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">向量化</text>
<text x="371.0" y="162" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#4f46e5">N × D 矩阵</text>
<line x1="436" y1="147" x2="450" y2="147" stroke="#c7cbd6" stroke-width="1.8" stroke-linecap="round"/><polygon points="450,147 442.8,150.5 442.8,143.5" fill="#c7cbd6"/>
<rect x="450" y="112" width="122" height="70" rx="9" fill="#cffafe" stroke="#0891b2" stroke-width="1.4"/>
<text x="511.0" y="140" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">索引</text>
<text x="511.0" y="162" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#0891b2">可检索</text>
<line x1="576" y1="147" x2="590" y2="147" stroke="#c7cbd6" stroke-width="1.8" stroke-linecap="round"/><polygon points="590,147 582.8,150.5 582.8,143.5" fill="#c7cbd6"/>
<rect x="590" y="112" width="122" height="70" rx="9" fill="#d1fae5" stroke="#059669" stroke-width="1.4"/>
<text x="651.0" y="140" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="13.5" font-weight="700" fill="#1f2937">检索</text>
<text x="651.0" y="162" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="10.5" fill="#059669">Top-K + 分数</text>
<text x="30" y="216" font-family="Inter,PingFang SC,sans-serif" font-size="12" font-weight="600" fill="#1f2937">每一环失败时，用户看到的都是同一句话：</text>
<rect x="30" y="230" width="700" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="380" y="259" text-anchor="middle" font-family="Inter,PingFang SC,sans-serif" font-size="14" font-weight="700" fill="#dc2626">「它答得不对」</text>
<text x="30" y="306" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">所以真正要设计的不是「链路能跑通」，而是「每一环失败都有信号」</text>
<text x="30" y="330" font-family="Inter,PingFang SC,sans-serif" font-size="11.5" fill="#6b7280">注意：只有最后一步注入 prompt 属于提示词工程，前四步全是数据工程</text>
</svg>
