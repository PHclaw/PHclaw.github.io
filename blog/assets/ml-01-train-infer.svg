<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390">
<rect width="760" height="390" fill="#ffffff"/>
<rect x="1" y="1" width="758" height="388" rx="12" fill="none" stroke="#e5e9f0"/>
<text x="28" y="40" font-family="Inter,PingFang SC,sans-serif" font-size="18" font-weight="700" fill="#1f2937">训练 vs 推理：你只需要后半段</text>
<text x="28" y="64" font-family="Inter,PingFang SC,sans-serif" font-size="12" fill="#6b7280">embedding 模型是别人训练好的成品 —— 你调用它把文本变成向量，不需要自己训练</text>
<rect x="28" y="96" width="330" height="250" rx="10" fill="#f5f7fa"/>
<text x="48" y="126" font-family="sans-serif" font-size="15" font-weight="700" fill="#1f2937">训练（Training）</text>
<text x="48" y="150" font-family="sans-serif" font-size="11" fill="#6b7280">模型公司做的事，一次性的</text>
<rect x="48" y="172" width="110" height="46" rx="7" fill="#ffffff" stroke="#e5e9f0"/>
<text x="103" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">海量文本</text>
<line x1="160" y1="195" x2="224" y2="195" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/><polygon points="224,195 214.3465918192059,200.27368092464624 214.3465918192059,189.72631907535376" fill="#6b7280"/>
<rect x="226" y="172" width="110" height="46" rx="7" fill="#ffffff" stroke="#e5e9f0"/>
<text x="281" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">GPU 集群</text>
<line x1="338" y1="195" x2="344" y2="195" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/><polygon points="344,195 334.3465918192059,200.27368092464624 334.3465918192059,189.72631907535376" fill="#6b7280"/>
<text x="48" y="252" font-family="sans-serif" font-size="12" fill="#6b7280">数月时间 · 数百万美元 · 调整内部参数</text>
<text x="48" y="280" font-family="sans-serif" font-size="12" fill="#6b7280">产出：一个「知道怎么把文字变向量」的模型</text>
<text x="48" y="318" font-family="sans-serif" font-size="13" font-weight="600" fill="#6b7280">← 你不用做这部分</text>
<rect x="398" y="96" width="334" height="250" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="418" y="126" font-family="sans-serif" font-size="15" font-weight="700" fill="#4f46e5">推理（Inference）</text>
<text x="418" y="150" font-family="sans-serif" font-size="11" fill="#6b7280">你每次调用 API 做的事</text>
<rect x="418" y="172" width="110" height="46" rx="7" fill="#ffffff" stroke="#4f46e5"/>
<text x="473" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">一句话</text>
<line x1="530" y1="195" x2="594" y2="195" stroke="#4f46e5" stroke-width="2" stroke-linecap="round"/><polygon points="594,195 584.3465918192059,200.27368092464624 584.3465918192059,189.72631907535376" fill="#4f46e5"/>
<rect x="596" y="172" width="112" height="46" rx="7" fill="#ffffff" stroke="#4f46e5"/>
<text x="652" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#1f2937">一串数字</text>
<text x="418" y="252" font-family="sans-serif" font-size="12" fill="#1f2937">几十毫秒 · 一次 API 调用 · 不需要 GPU</text>
<text x="418" y="280" font-family="sans-serif" font-size="12" fill="#1f2937">这就是你用 embedding 服务时发生的事</text>
<text x="418" y="318" font-family="sans-serif" font-size="13" font-weight="700" fill="#4f46e5">← 你只做这部分 ✓</text>
</svg>
