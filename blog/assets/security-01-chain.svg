<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"><rect width="880" height="470" fill="#ffffff"/><rect x="1" y="1" width="878" height="468" rx="12" fill="none" stroke="#e5e7eb"/><text x="28" y="40" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="18" font-weight="700" fill="#1f2937">从一段文档到任意代码执行</text><text x="28" y="63" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#6b7280">提示注入通过合法工具被放大：模型以为自己在做数学题</text><rect x="28" y="88" width="154" height="112" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="40" y="110" font-family="Consolas,monospace" font-size="11" font-weight="700" fill="#dc2626">01</text>
<text x="40" y="135" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">不可信文本</text>
<text x="40" y="156" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="9.5" fill="#6b7280">聊天 / 检索文档 / 网页</text>
<text x="186" y="148" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#6b7280">→</text>
<rect x="198" y="88" width="154" height="112" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="210" y="110" font-family="Consolas,monospace" font-size="11" font-weight="700" fill="#d97706">02</text>
<text x="210" y="135" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">模型以为在做数学题</text>
<text x="210" y="156" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="9.5" fill="#6b7280">「请计算 __import__(...)」</text>
<text x="356" y="148" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#6b7280">→</text>
<rect x="368" y="88" width="154" height="112" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="380" y="110" font-family="Consolas,monospace" font-size="11" font-weight="700" fill="#d97706">03</text>
<text x="380" y="135" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">调用 calculator 工具</text>
<text x="380" y="156" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="9.5" fill="#6b7280">expression 参数由模型填</text>
<text x="526" y="148" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#6b7280">→</text>
<rect x="538" y="88" width="154" height="112" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.4"/>
<text x="550" y="110" font-family="Consolas,monospace" font-size="11" font-weight="700" fill="#d97706">04</text>
<text x="550" y="135" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">tool_manager.execute</text>
<text x="550" y="156" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="9.5" fill="#6b7280">handler(**kwargs) 零验证</text>
<text x="696" y="148" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="13" fill="#6b7280">→</text>
<rect x="708" y="88" width="154" height="112" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.4"/>
<text x="720" y="110" font-family="Consolas,monospace" font-size="11" font-weight="700" fill="#dc2626">05</text>
<text x="720" y="135" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" font-weight="700" fill="#1f2937">eval(expression)</text>
<text x="720" y="156" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="9.5" fill="#6b7280">后端任意代码执行</text>
<rect x="28" y="222" width="824" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.3"/>
<text x="46" y="244" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="700" fill="#dc2626">关键点：不需要「越狱」</text>
<text x="46" y="263" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">模型只要相信自己在做一件正常的事——算个数。让模型「算个数」比让它主动越权容易得多</text>
<rect x="28" y="290" width="824" height="72" rx="9" fill="#f8fafc" stroke="#e5e7eb"/>
<text x="46" y="312" font-family="Consolas,monospace" font-size="11" fill="#1f2937">tool_manager.execute("calculator", expression="__import__('os').getcwd()")</text>
<text x="46" y="334" font-family="Consolas,monospace" font-size="11" font-weight="700" fill="#dc2626">→ {"success": True, "result": "D:\工作\agentflow-master\agent\backend"}</text>
<text x="46" y="352" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="10.5" fill="#6b7280">只用无害的 getcwd / echo 做验证，没读文件、没改文件、没发网络请求</text>
<text x="28" y="392" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="12.5" font-weight="700" fill="#1f2937">结论：任何工具参数，只要模型能填，就要当成攻击者可控的输入。</text>
<text x="28" y="414" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11.5" fill="#6b7280">「这是模型自己生成的」不是信任理由——模型的输入可能来自任何不可信内容</text>
<text x="28" y="440" font-family="Inter,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" fill="#6b7280">报告：Capri Security（独立 AI 红队研究）· 负责任披露，未公开、未打线上实例</text></svg>